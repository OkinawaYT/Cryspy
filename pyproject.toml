[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryspy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymatgen>=2025.10.7",
    # CrySPY 本体。下限のみ(新規探索の開始時に anl-cryspy が PyPI 最新へ自動更新する。README 参照)
    "csp-cryspy>=1.5.1",
]

[project.optional-dependencies]
chgnet = [
    "chgnet>=0.4.0",
]

[project.scripts]
anl-cryspy = "anl_cryspy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8",
]
